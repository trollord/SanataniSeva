<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Sanatani Seva">
  <!--
    A diya: flame over a lamp bowl. Two solid shapes and nothing else, because
    this is read at 16px in a browser tab - the previous icon was a 207KB
    auto-traced wordmark at 618x404, which turned to mush once squeezed into a
    square favicon slot.
  -->
  <rect width="512" height="512" rx="116" fill="#FF5F15"/>

  <!-- Flame -->
  <path
    fill="#fff"
    d="M256 104c6 0 10 4 13 9 14 25 28 44 40 61 15 21 24 41 24 64a77 77 0 0 1-154 0c0-23 9-43 24-64 12-17 26-36 40-61 3-5 7-9 13-9z"
  />

  <!-- Lamp bowl -->
  <path
    fill="#fff"
    d="M104 318h304c0 14-6 27-17 38-25 25-78 42-135 42s-110-17-135-42c-11-11-17-24-17-38z"
  />

  <!-- Rim, set off the bowl so the silhouette still reads when it shrinks -->
  <rect x="104" y="296" width="304" height="26" rx="13" fill="#fff"/>
</svg>
